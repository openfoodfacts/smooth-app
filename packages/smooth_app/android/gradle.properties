# Gradle memory limits
org.gradle.jvmargs=-Xmx2G -Xms256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX + Jetifier (leave enabled if project depends on legacy libs)
android.useAndroidX=true
android.enableJetifier=true

# Kotlin compiler validation
kotlin.jvm.target.validation.mode=IGNORE

# Gradle parallelization & workers (to prevent multi-GB spikes)
org.gradle.parallel=false
org.gradle.workers.max=2

# Improve build cache efficiency
org.gradle.daemon=true
org.gradle.caching=true
# cf. https://github.com/rive-app/rive-flutter/issues/553
rive.ndk.version=28.1.13356709
android.ndk.suppressMinSdkVersionError=21