site_name: Open Food Facts mobile app
site_url: https://openfoodfacts.github.io/smooth-app/
docs_dir: doc
repo_url: https://github.com/openfoodfacts/smooth-app
edit_uri: blob/develop/docs/
site_dir: gh_pages

theme:
  name: material
  palette:
    primary: beige
    text: black
  logo: assets/logo.svg
  features:
    - content.action.edit
markdown_extensions:
  - footnotes
  - mdx_truly_sane_lists
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - awesome-pages
  - search
