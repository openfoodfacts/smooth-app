name: 📱 Generate Signed PR APK

on:
  # Automatic trigger for PRs opened/updated by trusted maintainers
  pull_request_target:
    types: [opened, synchronize, reopened]
  # On-demand trigger by trusted maintainers commenting `/build-apk` on any PR
  issue_comment:
    types: [created]
  # Manual dispatch trigger
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build signed APK for'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-unsigned-apk:
    name: Build Unsigned APK
    concurrency:
      group: pr-signed-apk-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    # Restrict execution to trusted maintainers:
    # 1. PRs authored by teolemon, monsieurtanuki, or g123k on repository branches
    # 2. Comments with '/build-apk' posted by teolemon, monsieurtanuki, or g123k
    # 3. Manual dispatch by teolemon, monsieurtanuki, or g123k
    if: |
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository && (
        github.actor == 'teolemon' ||
        github.actor == 'monsieurtanuki' ||
        github.actor == 'g123k' ||
        github.event.pull_request.user.login == 'teolemon' ||
        github.event.pull_request.user.login == 'monsieurtanuki' ||
        github.event.pull_request.user.login == 'g123k'
      )) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/build-apk') && (
        github.actor == 'teolemon' ||
        github.actor == 'monsieurtanuki' ||
        github.actor == 'g123k'
       )
      ) ||
      (github.event_name == 'workflow_dispatch' && (
        github.actor == 'teolemon' ||
        github.actor == 'monsieurtanuki' ||
        github.actor == 'g123k'
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pr_number: ${{ steps.pr-context.outputs.pr_number }}
      head_sha: ${{ steps.commit-info.outputs.sha }}
      short_sha: ${{ steps.commit-info.outputs.short_sha }}
      comment_id: ${{ steps.pr-context.outputs.comment_id }}
    env:
      JAVA_VERSION: 21

    steps:
      - name: 🔍 Determine PR context and validate repository
        id: pr-context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}"
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "comment_id=${{ github.event.comment.id }}" >> $GITHUB_OUTPUT

          PR_DATA=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json headRepositoryOwner,isCrossRepository,headRefOid)
          IS_CROSS_REPO=$(echo "$PR_DATA" | jq -r '.isCrossRepository')
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.headRefOid')

          if [ "$IS_CROSS_REPO" = "true" ]; then
            echo "::error::Signed APK builds are only permitted for same-repository branches to safeguard signing credentials."
            exit 1
          fi

          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

      - name: 📂 Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr-context.outputs.head_sha }}
          persist-credentials: false

      - name: 🏷️ Get commit info
        id: commit-info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: packages/smooth_app/android

      - name: 🏷️ Get Flutter version
        id: flutter-version
        run: echo "FLUTTER_VERSION=$(cat flutter-version.txt)" >> $GITHUB_OUTPUT

      - name: 🪺 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
          cache-key: flutter-${{ hashFiles('flutter-version.txt')}}-${{ hashFiles('packages/smooth_app/pubspec.lock')}}

      - name: 🔍 Enable scanner dependency (ML Kit)
        run: chmod +x ci/dependencies/scanner/enable_mlkit_dependency.sh && ci/dependencies/scanner/enable_mlkit_dependency.sh

      - name: 🏪 Enable app store review dependency (Google Play)
        run: chmod +x ci/dependencies/app_store/enable_google_play_dependency.sh && ci/dependencies/app_store/enable_google_play_dependency.sh

      - name: 📦 Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('packages/smooth_app/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: 📦 Get dependencies
        run: ci/pub_get.sh

      - name: 🔨 Build unsigned APK
        working-directory: ./packages/smooth_app
        run: flutter build apk --release -t lib/entrypoints/android/main_google_play.dart --target-platform android-arm,android-arm64

      - name: 📋 Prepare unsigned APK for upload
        run: |
          UNSIGNED_APK=$(find packages/smooth_app/build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          cp "$UNSIGNED_APK" app-release-unsigned.apk

      - name: ⬆️ Upload unsigned APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-apk
          path: app-release-unsigned.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  sign-apk:
    name: Sign APK and Publish
    needs: build-unsigned-apk
    concurrency:
      group: pr-signed-apk-sign-${{ needs.build-unsigned-apk.outputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: 👀 Acknowledge comment
        if: github.event_name == 'issue_comment' && needs.build-unsigned-apk.outputs.comment_id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ needs.build-unsigned-apk.outputs.comment_id }}
          reactions: eyes

      - name: 📂 Checkout base repository for signing assets
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'zulu'
          java-version: 21

      - name: ⬇️ Download unsigned APK artifact
        uses: actions/download-artifact@v8
        with:
          name: unsigned-apk

      - name: 🔐 Decrypt Android keystore
        run: |
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.NEW_CYPHER }}" \
            --output packages/smooth_app/android/fastlane/envfiles/keystore.jks \
            packages/smooth_app/android/fastlane/envfiles/keystore.jks.gpg

      - name: ✍️ Sign APK
        id: sign-apk
        env:
          SIGN_STORE_PASSWORD: ${{ secrets.DECRYPT_FOR_SCANNER_FILE }}
          SIGN_KEY_ALIAS: ${{ secrets.ALIAS_FOR_SCANNER }}
          SIGN_KEY_PASSWORD: ${{ secrets.KEY_FOR_SCANNER }}
        run: |
          APK_FILENAME="smooth-app-pr-${{ needs.build-unsigned-apk.outputs.pr_number }}-${{ needs.build-unsigned-apk.outputs.short_sha }}-signed.apk"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks packages/smooth_app/android/fastlane/envfiles/keystore.jks \
            --ks-key-alias "$SIGN_KEY_ALIAS" \
            --ks-pass "pass:$SIGN_STORE_PASSWORD" \
            --key-pass "pass:$SIGN_KEY_PASSWORD" \
            --out "$APK_FILENAME" \
            app-release-unsigned.apk
          echo "apk_filename=$APK_FILENAME" >> $GITHUB_OUTPUT

      - name: 🧹 Clean up decrypted keystore
        if: always()
        run: rm -f packages/smooth_app/android/fastlane/envfiles/keystore.jks

      - name: ⬆️ Upload signed APK artifact
        id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: smooth-app-pr-${{ needs.build-unsigned-apk.outputs.pr_number }}-signed-apk
          path: ${{ steps.sign-apk.outputs.apk_filename }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: 🔍 Find existing PR comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ needs.build-unsigned-apk.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Signed APK ready for testing!'

      - name: 🔍 Verify APK is current before publishing
        id: publish-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.build-unsigned-apk.outputs.pr_number }}
          BUILT_HEAD_SHA: ${{ needs.build-unsigned-apk.outputs.head_sha }}
          COMMENT_BODY: ${{ steps.find-comment.outputs.comment-body }}
        run: |
          CURRENT_HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT_HEAD_SHA" != "$BUILT_HEAD_SHA" ]; then
            echo "::notice::Skipping comment publication because the PR head has changed."
            exit 0
          fi

          # Concurrency queues are unordered; don't replace a newer run's links.
          RUN_NUMBER_PATTERN='<!-- signed-apk-run: ([0-9]+) -->'
          if [[ "$COMMENT_BODY" =~ $RUN_NUMBER_PATTERN ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
            echo "::notice::Skipping comment publication because a newer run has already published."
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: 💬 Post or update PR comment
        if: steps.publish-check.outputs.publish == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ needs.build-unsigned-apk.outputs.pr_number }}
          edit-mode: replace
          body: |
            <!-- signed-apk-run: ${{ github.run_number }} -->

            ### 📱 Signed APK ready for testing!

            A signed release APK has been generated for PR #${{ needs.build-unsigned-apk.outputs.pr_number }} at commit `${{ needs.build-unsigned-apk.outputs.short_sha }}`.

            - 📥 **[Download Signed APK](${{ steps.upload-artifact.outputs.artifact-url }})**
            - 📦 **Artifact file:** `${{ steps.sign-apk.outputs.apk_filename }}` (in zip archive)
            - 🔗 **[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**

            > _Note: You must be logged into GitHub to download the build artifact. Extract the downloaded zip file to install the APK._

      - name: 🚀 Add rocket reaction to comment
        if: github.event_name == 'issue_comment' && success() && needs.build-unsigned-apk.outputs.comment_id != '' && steps.publish-check.outputs.publish == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ needs.build-unsigned-apk.outputs.comment_id }}
          reactions: rocket
