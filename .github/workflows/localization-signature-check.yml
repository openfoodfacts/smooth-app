name: Localization Signature Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "packages/smooth_app/lib/l10n/app_*.arb"
      - ".github/scripts/localization_signature_check.py"
      - ".github/workflows/localization-signature-check.yml"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  localization-signature-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check localization placeholder signatures
        run: python3 .github/scripts/localization_signature_check.py
