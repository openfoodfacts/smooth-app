name: GitHub Pages Deploy Action

on:
  push:
    branches:
      - "develop"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Get the Flutter version from ./flutter-version.txt
      - name: Get Flutter version
        run: echo "FLUTTER_VERSION=$(cat flutter-version.txt)" >> $GITHUB_OUTPUT
        id: flutter-version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
          cache-key: flutter-${{ hashFiles('flutter-version.txt') }}-${{ hashFiles('packages/smooth_app/pubspec.lock') }}

      - name: Verify Flutter version
        run: flutter --version

      - name: Get dependencies
        run: ci/pub_get.sh

      # Generated localization files (120+ language files with >120,000 getters)
      # bloat the dartdoc search index (index.json) to >100MB, which exceeds GitHub's 100MB file limit.
      - name: Remove generated localization files before dartdoc
        run: rm -f packages/smooth_app/lib/l10n/app_localizations_*.dart

      - name: Run Dartdoc
        run: dart doc .
        working-directory: ./packages/smooth_app

      - name: Install mkdocs and mkdocs-material
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mdx_truly_sane_lists pymdown-extensions mkdocs-awesome-pages-plugin
        working-directory: ./packages/smooth_app

      - name: Build documentation using mkdocs
        run: mkdocs build
        working-directory: ./packages/smooth_app

      # Ensure no generated artifacts exceed GitHub's 100MB file limit (e.g. search indices)
      - name: Verify documentation file sizes
        run: |
          python3 -c "
          import os
          folder = 'packages/smooth_app/gh_pages'
          max_size = 95 * 1024 * 1024
          for root, _, files in os.walk(folder):
              for f in files:
                  fp = os.path.join(root, f)
                  size = os.path.getsize(fp)
                  if size > max_size:
                      print(f'Warning: {fp} is {size / (1024*1024):.2f} MB (exceeds limit)')
                      if fp.endswith('api/index.json'):
                          print('Replacing oversized api/index.json with empty index')
                          with open(fp, 'w') as out:
                              out.write('[]')
          "

      - name: Add .nojekyll
        run: touch packages/smooth_app/gh_pages/.nojekyll

      - name: Deploy smooth_app documentation to Github Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          BRANCH: gh-pages
          FOLDER: packages/smooth_app/gh_pages/
